<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 출장 및 유류비 정산 관리 시스템</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GMarketSans 폰트 및 단일 라인 CSS 규칙 준수 -->
  <style>
    @font-face { font-family: 'GmarketSans'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'GmarketSans'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff'); font-weight: 500; font-style: normal; }
    @font-face { font-family: 'GmarketSans'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff'); font-weight: 700; font-style: normal; }
    body { font-family: 'GmarketSans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50/40 to-slate-200 min-h-screen flex flex-col justify-between text-slate-800 antialiased">

  <!-- 상단 네비게이션 헤더 바 -->
  <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 tracking-tight">출장 및 유류비 정산 시스템</h1>
          <p class="text-[11px] text-slate-500 font-medium">Business Trip &amp; Fuel Expense Portal</p>
        </div>
      </div>
      <div class="text-xs text-slate-500 hidden sm:flex items-center gap-1.5 font-medium">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        사용자 로그인 포털
      </div>
    </div>
  </header>

  <!-- 메인 로그인 카드 영역 -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- 로그인 폼 카드 -->
      <div class="bg-white rounded-2xl border border-slate-200/90 shadow-xl shadow-slate-200/50 p-6 sm:p-8">
        
        <!-- 카드 상단 타이틀 -->
        <div class="text-center mb-7">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 mb-3 border border-indigo-100 shadow-xs">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <h2 class="text-xl font-bold text-slate-900">사용자 로그인</h2>
          <p class="text-xs text-slate-500 mt-1">출장 내역 및 정산 업무를 위해 계정 정보를 입력하세요.</p>
        </div>

        <!-- 경고 메시지 배너 (오류 시 표시) -->
        <div id="loginErrorAlert" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 flex items-start gap-2">
          <svg class="w-4 h-4 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="loginErrorMessage" class="leading-relaxed">아이디 또는 비밀번호를 확인해주세요.</span>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" onsubmit="event.preventDefault(); window.handleLogin();" class="space-y-4">
          
          <!-- 아이디 입력 필드 -->
          <div>
            <label for="loginId" class="block text-xs font-bold text-slate-700 mb-1.5">아이디 (사번 또는 성명)</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <input 
                type="text" 
                id="loginId" 
                name="username" 
                required 
                placeholder="아이디 또는 성명 입력" 
                autocomplete="username"
                class="w-full pl-9 pr-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-2xs">
            </div>
          </div>

          <!-- 비밀번호 입력 필드 -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="loginPw" class="block text-xs font-bold text-slate-700">비밀번호</label>
              <button type="button" onclick="window.togglePasswordVisibility()" class="text-[11px] text-indigo-600 hover:text-indigo-700 font-medium focus:outline-none" id="btnTogglePw">
                비밀번호 보기
              </button>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input 
                type="password" 
                id="loginPw" 
                name="password" 
                required 
                placeholder="비밀번호 입력" 
                autocomplete="current-password"
                class="w-full pl-9 pr-10 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-2xs">
              <button 
                type="button" 
                onclick="window.togglePasswordVisibility()" 
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                title="비밀번호 표시 전환">
                <svg id="iconEyeOpen" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg id="iconEyeClosed" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 옵션: 아이디 저장 -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center cursor-pointer select-none">
              <input type="checkbox" id="saveId" class="w-3.5 h-3.5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
              <span class="ml-2 text-xs text-slate-600 font-medium">아이디 기억하기</span>
            </label>
            <span class="text-[11px] text-slate-400">보안 세션 유지</span>
          </div>

          <!-- 로그인 제출 버튼 -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="btnLogin" 
              onclick="window.handleLogin()"
              class="w-full flex items-center justify-center py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 transition shadow-md shadow-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              <span id="btnLoginText">로그인</span>
              <svg id="btnLoginSpinner" class="hidden animate-spin ml-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <!-- 간편 체험 / 빠른 로그인 바로가기 -->
        <div class="mt-6 pt-5 border-t border-slate-100">
          <div class="text-[11px] font-bold text-slate-500 mb-2 flex items-center justify-between">
            <span>사용자 계정</span>
            <span class="text-indigo-600 font-normal">아이디 자동 입력</span>
          </div>
          <div>
            <button 
              type="button" 
              onclick="window.fillDemoAccount('김진영')"
              class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 hover:bg-indigo-50/60 hover:border-indigo-200 text-slate-700 text-xs font-medium transition text-left flex items-center justify-between">
              <span class="font-bold text-slate-800">김진영 (영업실행팀)</span>
              <span class="text-[11px] text-indigo-600">아이디 채우기</span>
            </button>
          </div>
        </div>

      </div>

      <!-- 안내 문구 -->
      <div class="mt-4 text-center">
        <p class="text-xs text-slate-500">
          인증 완료 후 설정된 대상 페이지로 자동 이동합니다.
        </p>
      </div>

    </div>
  </main>

  <!-- 하단 카피라이트 푸터 -->
  <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white/50">
    <div class="max-w-7xl mx-auto px-4">
      &copy; 2026 출장 및 유류비 정산 관리 포털. All rights reserved.
    </div>
  </footer>

  <!-- ====================================================================== -->
  <!-- [자바스크립트 로직] -->
  <!-- ====================================================================== -->
  <script>
    // 0. 로컬 설정 객체 캐시
    let localConfig = null;

    /**
     * [설정 로드 및 사용자 인증 함수]
     * config의 환경변수 단일값(secret_code, target_page)을 기준으로 인증을 수행합니다.
     */
    window.fetchLocalConfig = async function(userAuthCode) {
      // 1. 로컬 config.json 파일을 비동기적으로 가져와서 localConfig 변수에 저장
      try {
        const response = await fetch('./config.json');
        if (!response.ok) throw new Error('Failed to load config.json');
        localConfig = await response.json();
      } catch (error) {
        // 로컬 파일이 없는 것은 배포 환경에서 정상이므로 조용히 넘어감
      }

      // 로컬 config.json이 있으면 단일 환경변수(secret_code, target_page)로 검증
      if (localConfig) {
        if (userAuthCode === localConfig.secret_key) {
          const path = localConfig.target_page;
          return { success: true, role: 'user', targetPath: path };
        }
        return { success: false, message: '비밀번호가 일치하지 않습니다.' };
      }

      // 2. 로컬 config.json 없으면 서버에 요청 - 로그인
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json; charset=UTF-8' },
          body: JSON.stringify({ authCode: userAuthCode })
        });
        const loginData = await res.json();

        // config 환경변수 추가 
        if (loginData && loginData.success) {
          try {
            const configRes = await fetch('/config');
            if (configRes.ok) {
              const configData = await configRes.json();
              loginData.targetPath = configData.target_page;
            }
          } catch (configErr) {
            console.error('/config 로드 오류', configErr);
          }
          return loginData;
        }

        return loginData || { success: false, message: '인증에 실패하였습니다.' };
      } catch (err) {
        console.error("error occurred", err);
        alert("통신 중 오류 발생하였습니다.");
        return { success: false, message: '통신 중 오류 발생하였습니다.' };
      }
    };

    // 1. 페이지 로드 시 저장된 아이디 불러오기 및 기본 포커스
    document.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('saved_login_id');
      if (savedId) {
        document.getElementById('loginId').value = savedId;
        document.getElementById('saveId').checked = true;
        document.getElementById('loginPw').focus();
      } else {
        document.getElementById('loginId').focus();
      }
    });

    // 2. 비밀번호 가시성 토글 (보기 / 숨기기)
    window.togglePasswordVisibility = function() {
      const pwInput = document.getElementById('loginPw');
      const iconOpen = document.getElementById('iconEyeOpen');
      const iconClosed = document.getElementById('iconEyeClosed');
      const btnToggle = document.getElementById('btnTogglePw');

      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        iconOpen.classList.remove('hidden');
        iconClosed.classList.add('hidden');
        btnToggle.textContent = '비밀번호 숨기기';
      } else {
        pwInput.type = 'password';
        iconOpen.classList.add('hidden');
        iconClosed.classList.remove('hidden');
        btnToggle.textContent = '비밀번호 보기';
      }
    };

    // 3. 사용자 아이디 자동입력
    window.fillDemoAccount = function(id) {
      document.getElementById('loginId').value = id;
      window.hideError();
      document.getElementById('loginPw').focus();
    };

    // 4. 오류 메시지 표시 함수
    window.showError = function(msg) {
      const alertBox = document.getElementById('loginErrorAlert');
      const msgBox = document.getElementById('loginErrorMessage');
      msgBox.textContent = msg;
      alertBox.classList.remove('hidden');
    };

    // 5. 오류 메시지 숨김 함수
    window.hideError = function() {
      const alertBox = document.getElementById('loginErrorAlert');
      alertBox.classList.add('hidden');
    };

    // 6. 로그인 처리 핸들러 (fetchLocalConfig 연동)
    window.handleLogin = async function() {
      const idInput = document.getElementById('loginId');
      const pwInput = document.getElementById('loginPw');
      const saveIdCheck = document.getElementById('saveId');
      const id = idInput.value.trim();
      const pw = pwInput.value.trim();

      window.hideError();

      if (!id) {
        window.showError('아이디(사번 또는 성명)를 입력해주세요.');
        idInput.focus();
        return;
      }
      if (!pw) {
        window.showError('비밀번호를 입력해주세요.');
        pwInput.focus();
        return;
      }

      // 로그인 진행 UI (스피너 및 비활성화)
      const btn = document.getElementById('btnLogin');
      const btnText = document.getElementById('btnLoginText');
      const spinner = document.getElementById('btnLoginSpinner');
      btn.disabled = true;
      btnText.textContent = '인증 확인 중...';
      spinner.classList.remove('hidden');

      try {
        // 비동기 fetchLocalConfig 호출 (비밀번호 검증)
        const result = await window.fetchLocalConfig(pw);

        if (result && result.success) {
          // 아이디 기억하기 처리
          if (saveIdCheck.checked && id) {
            localStorage.setItem('saved_login_id', id);
          } else {
            localStorage.removeItem('saved_login_id');
          }

          // 세션 정보 및 secret_code 저장
          sessionStorage.setItem('secret_code', pw);
          const sessionUser = {
            id: id,
            name: id,
            role: 'user',
            targetPath: result.targetPath,
            loginAt: new Date().toISOString()
          };
          sessionStorage.setItem('current_user', JSON.stringify(sessionUser));

          btnText.textContent = '로그인 완료!';

          // config에 설정된 targetPath로 이동
          const targetUrl = result.targetPath;
          if (targetUrl) {
            setTimeout(() => {
              window.location.href = targetUrl;
            }, 300);
          } else {
            window.showError('이동할 대상 페이지 경로가 설정되어 있지 않습니다.');
          }
        } else {
          window.showError(result?.message || '비밀번호가 일치하지 않습니다.');
          pwInput.focus();
        }
      } catch (err) {
        console.error('로그인 오류:', err);
        window.showError('로그인 처리 중 예기치 않은 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
        btnText.textContent = '로그인';
        spinner.classList.add('hidden');
      }
    };
  </script>
</body>
</html>
